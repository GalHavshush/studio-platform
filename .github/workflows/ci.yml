name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # same version as docker-compose.yml
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        # Wait until Postgres accepts connections before the first step that needs it.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      # Throwaway DB that only lives for this job, so no GitHub secret is needed.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # exact: setup-uv has no floating major tag
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest
